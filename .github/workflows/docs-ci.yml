name: Docs CI/CD

# Validates and deploys the VitePress documentation site independently of
# the MockOps application (see mockops-ci.yml / mockops-release.yml).
#
# - Any push/PR touching docs content builds the site (PRs only validate —
#   they never deploy).
# - Only a push to `main` deploys to GitHub Pages.
# - A documentation-only change never touches the MockOps app: no app
#   tests, no application build, no Docker build, no GHCR push, no
#   application release.
#
# Every job always *triggers* and reports a real conclusion (success or
# skipped) rather than using a `paths` filter to not trigger at all — for
# the same reason as mockops-ci.yml: if `build` is a required status check,
# an app-only PR that never triggers this workflow at all would leave that
# check permanently pending and unable to merge. Skipped satisfies a
# required check; missing does not.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Default to read-only; only the deploy job below elevates to pages/id-token
# write, and only for pushes to main. A same-repo PR build never receives
# deployment permissions, and a fork PR never receives write permissions at
# all under `pull_request`.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docs:
              - 'docs/**'
              - 'README.md'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/docs-ci.yml'

  build:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    # Scoped per-ref and cancelable — a PR's build-only run must never
    # queue behind main's deploy pipeline (they share no state), and a
    # superseded push to the same ref/PR should cancel its stale build.
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          # VitePress' `lastUpdated` reads git history per-page; a shallow
          # clone would only ever show the checkout commit's date.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build docs
        run: npm run docs:build

      # A PR run only needs to prove the build above succeeds — it never
      # deploys, so there's nothing further to do. On a push to main, hand
      # the built site to the `deploy` job as a plain build artifact: the
      # Pages API calls (configure-pages/upload-pages-artifact) themselves
      # happen over there, in the job that actually holds `pages: write` —
      # this job only ever has `contents: read`, on every run including PRs.
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: docs-dist
          path: docs/.vitepress/dist
          retention-days: 1

  deploy:
    # Only publish from main — PRs just verify the build above.
    if: github.event_name != 'pull_request' && needs.changes.outputs.docs == 'true'
    needs: [changes, build]
    runs-on: ubuntu-latest
    # Least-privilege: only this job, which only runs for a push to main,
    # gets to write to Pages. The build job above (including every PR run)
    # never holds these permissions.
    permissions:
      contents: read
      pages: write
      id-token: write
    # A new deploy waits for any in-flight one to finish rather than
    # cancelling it, so a Pages deployment is never interrupted mid-way.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download docs build
        uses: actions/download-artifact@v8
        with:
          name: docs-dist
          path: docs/.vitepress/dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

      - id: deployment
        uses: actions/deploy-pages@v4
