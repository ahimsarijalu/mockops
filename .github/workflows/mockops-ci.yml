name: MockOps CI

# Validates the MockOps application itself: type-check, lint, unit tests,
# e2e smoke tests, production build, and a Docker build check.
#
# Skips its real work for a documentation-only pull request (see the
# `changes` job below) — that's the job of docs-ci.yml. A PR that touches
# any non-docs file still runs the full suite, including PRs that touch
# both app and docs files.
#
# Every job always *triggers* and reports a real conclusion (success or
# skipped) rather than using paths-ignore to not trigger at all: if these
# jobs are configured as required status checks on `main`, paths-ignore
# would leave a docs-only PR's checks permanently pending (GitHub has
# nothing to report a status for) and it could never merge. Skipped
# still satisfies a required check; missing does not.
#
# This workflow never pushes a Docker image. Publishing to GHCR, Git tags,
# and GitHub Releases are handled exclusively by mockops-release.yml on
# `main`, after this same validation has passed there too — running it a
# second time here on every push to `main` would just duplicate that work.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mockops-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app:
              - '**'
              - '!docs/**'
              - '!README.md'
              - '!.github/workflows/docs-ci.yml'

  build-and-test:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate route tree
        run: npm run generate-routes

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate route tree
        run: npm run generate-routes

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E smoke tests
        run: npm run test:e2e

  docker:
    needs: [changes, build-and-test, e2e]
    if: github.event_name != 'pull_request' || needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Validation only — never pushed. This proves the image still builds
      # on every PR without granting PR runs any registry credentials.
      #
      # cache-from only, no cache-to: a fork PR's GITHUB_TOKEN is read-only
      # and can't write a new GHA cache entry, and this job doesn't need
      # to seed one anyway — mockops-release.yml's docker build already
      # writes cache-to on every push to main, which every PR build here
      # then reads from.
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: mockops:pr-${{ github.event.pull_request.number || github.run_id }}
          cache-from: type=gha
