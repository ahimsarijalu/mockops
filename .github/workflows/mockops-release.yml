name: MockOps Release

# Cuts a MockOps application release on every push to `main`: determines
# whether a release is actually needed (skipped for documentation-only
# changes), computes the next SemVer version, re-validates and builds the
# app, builds and pushes the Docker image to GHCR, then creates the Git tag
# and GitHub Release — in that order, so a tag is never created for a build
# that didn't actually succeed.

on:
  push:
    branches: [main]

# Never run two releases concurrently, and never cancel one mid-flight —
# that would leave GHCR/tags/releases in an inconsistent state.
concurrency:
  group: mockops-release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  determine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_required: ${{ steps.determine.outputs.release_required }}
      version: ${{ steps.determine.outputs.version }}
      previous_version: ${{ steps.determine.outputs.previous_version }}
      bump: ${{ steps.determine.outputs.bump }}
      reason: ${{ steps.determine.outputs.reason }}
      pr_numbers: ${{ steps.determine.outputs.pr_numbers }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - id: determine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node .github/scripts/mockops-release.mjs

      - name: Summary
        run: |
          {
            echo "## MockOps Release — Determination"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Release required | \`${{ steps.determine.outputs.release_required }}\` |"
            echo "| Previous version | \`${{ steps.determine.outputs.previous_version || '(none)' }}\` |"
            echo "| Next version | \`${{ steps.determine.outputs.version || '-' }}\` |"
            echo "| Bump | \`${{ steps.determine.outputs.bump || '-' }}\` |"
            echo "| Reason | ${{ steps.determine.outputs.reason }} |"
            echo "| Merged PRs considered | ${{ steps.determine.outputs.pr_numbers || '(none)' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: determine
    if: needs.determine.outputs.release_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run generate-routes
      - run: npx tsc -b --noEmit
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  release:
    needs: [determine, validate]
    if: needs.determine.outputs.release_required == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.determine.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Re-verify the tag is still free right before we act on it — closes
      # the race window between the `determine` job and this one.
      - name: Verify tag is still available
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} already exists — refusing to release."
            exit 1
          fi
          echo "IMAGE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.IMAGE_VERSION }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only now that the image has actually built and pushed do we mint
      # the tag and the release — never before.
      - name: Create Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "MockOps ${VERSION}"
          git push origin "refs/tags/${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${VERSION}" \
            --title "MockOps ${VERSION}" \
            --generate-notes \
            --notes "Docker image: \`ghcr.io/${{ github.repository }}:${IMAGE_VERSION}\`"

      - name: Summary
        run: |
          {
            echo "## MockOps Release"
            echo
            echo "- **Previous version:** \`${{ needs.determine.outputs.previous_version || '(none)' }}\`"
            echo "- **Release type:** \`${{ needs.determine.outputs.bump }}\`"
            echo "- **New version:** \`${VERSION}\`"
            echo "- **Merged PRs:** ${{ needs.determine.outputs.pr_numbers || '(none)' }}"
            echo "- **Docker image:** \`ghcr.io/${{ github.repository }}:${IMAGE_VERSION}\`, \`ghcr.io/${{ github.repository }}:latest\`"
            echo "- **Git tag:** \`${VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
