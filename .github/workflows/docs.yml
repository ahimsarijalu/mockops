name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Scoped per-ref and cancelable — a PR's build-only run must never
    # queue behind main's deploy pipeline (they share no state), and a
    # superseded push to the same ref/PR should cancel its stale build.
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # VitePress' `lastUpdated` reads git history per-page; a shallow
          # clone would only ever show the checkout commit's date.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build docs
        run: npm run docs:build

      # A PR run only needs to prove the build above succeeds — it never
      # deploys, so it has no reason to call the Pages API (which 404s
      # until Pages is enabled on the repository).
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    # Only publish from main — PRs just verify the build above.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # A new deploy waits for any in-flight one to finish rather than
    # cancelling it, so a Pages deployment is never interrupted mid-way.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
